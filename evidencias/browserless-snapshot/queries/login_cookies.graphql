# Exporta las cookies de una sesión FRESCA recién logueada.
# Repite login_identifier + login_password y vuelca cookies para validar el
# flujo Prime por HTTP (curl) con sesión fresca, como hará el gate.
# Las cookies vivas quedan en result.json: redactar el archivo tras extraer
# lo necesario. Compatible con step_runner.py.
# ESTADO: autorizado por el dueño (cuenta de prueba).
mutation LoginCookies($url: String!, $login: String!, $password: String!) {
  open: goto(url: $url, waitUntil: networkIdle) {
    status
    url
    time
  }
  emailReady: waitForSelector(selector: "#ap_email_login", timeout: 20000) {
    selector
    time
  }
  emailTyped: type(selector: "#ap_email_login", text: $login) {
    selector
    time
  }
  continued: click(selector: "#continue") {
    selector
    time
  }
  passwordReady: waitForSelector(selector: "#ap_password", timeout: 20000) {
    selector
    time
  }
  passwordTyped: type(selector: "#ap_password", text: $password) {
    selector
    time
  }
  submitted: click(selector: "#signInSubmit") {
    selector
    time
  }
  settled: waitForTimeout(time: 8000) {
    time
  }
  sessionCookies: cookies {
    cookies {
      name
      value
      domain
    }
  }
}
