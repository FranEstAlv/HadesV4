# PASO 2 del flujo Prime (password). Repite el identificador (cada corrida
# Browserless es un navegador nuevo) y envía el password.
# Flujo verificado en step_login_identifier_20261010_061337: tras Continuar,
# Amazon muestra #ap_password + #signInSubmit, sin errores ni OTP.
# Compatible con step_runner.py ($url/$login/$password como variables).
# ESTADO: autorizado por el dueño (cuenta de prueba).
mutation LoginPassword($url: String!, $login: String!, $password: String!) {
  open: goto(url: $url, waitUntil: networkIdle) {
    status
    url
    time
  }
  emailReady: waitForSelector(selector: "#ap_email_login", timeout: 20000) {
    selector
    time
  }
  emailTyped: type(selector: "#ap_email_login", text: $login) {
    selector
    time
  }
  continued: click(selector: "#continue") {
    selector
    time
  }
  passwordReady: waitForSelector(selector: "#ap_password", timeout: 20000) {
    selector
    time
  }
  passwordTyped: type(selector: "#ap_password", text: $password) {
    selector
    time
  }
  submitted: click(selector: "#signInSubmit") {
    selector
    time
  }
  settled: waitForTimeout(time: 8000) {
    time
  }
  title {
    text: title
  }
  headings: querySelectorAll(selector: "h1, h2, h3") {
    innerText
  }
  forms: querySelectorAll(selector: "form") {
    id
    className
    innerText
  }
  inputs: querySelectorAll(selector: "input") {
    id
    className
  }
  buttons: querySelectorAll(selector: "button, input[type=submit]") {
    innerText
    id
  }
  selects: querySelectorAll(selector: "select") {
    id
  }
  links: querySelectorAll(selector: "a") {
    innerText
  }
  images: querySelectorAll(selector: "img") {
    id
    className
  }
  pageHTML: html {
    html
  }
  screenshot {
    base64
  }
}
