		<script type="text/javascript">
			window.abort_on_close = true;

			// Css is taken from sylesheet
			$.blockUI.defaults.css = {};

			function blockUI(msg) {

				// True means the payment form is submitting
				if (msg === true) {
					msg = "Please wait while we verify your account";
					window.abort_on_close = false;
				}

				if (msg == '') {
					$.blockUI({message: ''});
				} else {
					$.blockUI({message: '<div id="please-wait-spinner"></div><div>' + msg  + '</div>', blockMsgClass: 'please-wait-message', css: {backgroundColor: null, border: null, color: null}});
					$('#please-wait-spinner').spinner();
				}

			}

			function unblockUI() {
				$.unblockUI();
			}

			navigator.sendBeacon = navigator.sendBeacon || function (url, data) {
				var client = new XMLHttpRequest();
				client.open('POST', url, false); // third parameter indicates sync xhr
				client.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
				client.send(data);
			};

			$(document).ready(function () {

				$('#payment').on('submit', function () {
					$('#paybttn').attr('disabled','disabled');
					$('.cancelbttn').attr('disabled','disabled');
					blockUI(true);
					window.abort_on_close = false;
					//console.log('payment form submitted');
					return true;
				});

				if (document.body.id === 'form' || document.body.id === 'acs-frame' || document.body.id === 'acs-method-frame') {
					$(window).on('unload', function () {
						if (window.abort_on_close) {
							var url = window.location.href;
							url = url + (url.indexOf('?') === -1 ? '?' : '&') + 'process=abort&url=' + encodeURIComponent(url) + '&session=' + "8fb8a98dac485ba1c2c3b725ddeb2d85";
							var data = '';
							var status = navigator.sendBeacon(url, data);
							//console.log('sendBeacon: url = ' + url + '; data = ' + data + '; status = ' + status);
						}
					});
				}

				// Add rel="noopener noreferrer nofollow" to target="_blank" anchors
				// https://www.jitbit.com/alexblog/256-targetblank---the-most-underestimated-vulnerability-ever/
				$('a[target="_blank"]').each(function () {
					if (location.hostname !== this.hostname) {
						var rel = (this.rel === undefined) ? '' : this.rel.toLowerCase();
						if (rel.indexOf('noopener') === -1){
							rel += ' noopener';
						}
						if (rel.indexOf('noreferrer') === -1){
							rel += ' noreferrer';
						}
						if (rel.indexOf('nofollow') === -1){
							rel += ' nofollow';
						}
						$(this).attr('rel', rel);
					}
				});

			});
