# PASO 1 del flujo Prime (identificador, SIN password).
# Abre el entry Prime, escribe el email en #ap_email_login, pulsa Continuar
# (#continue) y captura el estado resultante para ver qué pide Amazon
# después (password, OTP o passkey).
# El password ($password) se envía en un paso posterior, cuando se conozca
# la pantalla siguiente. Compatible con step_runner.py (lee data.open como
# navegación y $url/$login/$password como variables).
# Selectores verificados contra snapshot real del muro ap/signin MX
# (output/snapshot_20261010_061111): #ap_email_login y #continue existen.
# ESTADO: NO EJECUTADO contra Amazon. Requiere autorización explícita: hace
# login real en la cuenta y Amazon puede pedir verificación (OTP/email).
# Nota: step_runner envía también $password, el servidor ignora variables
# extra; se declara solo lo que este paso usa.
mutation LoginIdentifier($url: String!, $login: String!) {
  open: goto(url: $url, waitUntil: networkIdle) {
    status
    url
    time
  }
  emailReady: waitForSelector(selector: "#ap_email_login", timeout: 20000) {
    selector
    time
  }
  emailTyped: type(selector: "#ap_email_login", text: $login) {
    selector
    time
  }
  continued: click(selector: "#continue") {
    selector
    time
  }
  settled: waitForTimeout(time: 5000) {
    time
  }
  title {
    text: title
  }
  headings: querySelectorAll(selector: "h1, h2, h3") {
    innerText
  }
  forms: querySelectorAll(selector: "form") {
    id
    className
    innerText
  }
  inputs: querySelectorAll(selector: "input") {
    id
    className
  }
  buttons: querySelectorAll(selector: "button, input[type=submit]") {
    innerText
    id
  }
  selects: querySelectorAll(selector: "select") {
    id
  }
  links: querySelectorAll(selector: "a") {
    innerText
  }
  images: querySelectorAll(selector: "img") {
    id
    className
  }
  pageHTML: html {
    html
  }
  screenshot {
    base64
  }
}
