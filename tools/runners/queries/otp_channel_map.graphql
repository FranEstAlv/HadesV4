# Mapeo del canal OTP en el registro USA (identifier-first + Proceed).
# Solo lectura del entry: no compra numero, no registra cuenta.
# Replica los pasos del script bot_cookie_old.py hasta el punto donde
# aparece el formulario de nombre/password: identificador -> Continue ->
# "Proceed to create an account" -> espera -> inventario del DOM.
# Sirve para ver si Amazon ofrece canal WhatsApp vs SMS sin gastar numero.
mutation OtpChannelMap($url: String!) {
  open: goto(url: $url, waitUntil: networkIdle) {
    status
    url
    time
  }
  emailReady: waitForSelector(selector: "#ap_email_login", timeout: 20000) {
    selector
    time
  }
  title {
    text: title
  }
  headings: querySelectorAll(selector: "h1, h2, h3") {
    innerText
  }
  forms: querySelectorAll(selector: "form") {
    id
    className
    innerText
  }
  inputs: querySelectorAll(selector: "input") {
    id
    className
  }
  buttons: querySelectorAll(selector: "button, input[type=submit]") {
    innerText
    id
  }
  selects: querySelectorAll(selector: "select") {
    id
  }
  links: querySelectorAll(selector: "a") {
    innerText
  }
  radioInfo: evaluate(content: "JSON.stringify(Array.from(document.querySelectorAll('input[type=\"radio\"]')).map(r => { const l = r.closest('label') || document.querySelector('label[for=\"' + r.id + '\"]'); return {id: r.id||'', name: r.name||'', value: r.value||'', checked: !!r.checked, label: ((l?l.innerText:'')||'').trim().slice(0,120)}; })).slice(0,2000)") {
    value
  }
  channelKeywords: evaluate(content: "(() => { const b=(document.body.innerText||'').toLowerCase(); const out=[]; for (const kw of ['whatsapp','sms','text message','otp','verification code','send code','resend','proceed to create an account','looks like you']) { if (b.includes(kw)) out.push(kw); } return JSON.stringify(out); })()") {
    value
  }
  hasProceed: evaluate(content: "String(document.body.innerText.toLowerCase().includes('proceed to create an account'))") {
    value
  }
  pageHTML: html {
    html
  }
  screenshot {
    base64
  }
}
